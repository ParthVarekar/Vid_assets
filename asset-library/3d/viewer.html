<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProtoVinci 3D models</title>
<!-- Open through a local server (e.g. `npx serve asset-library/3d`), since browsers block .glb loads from file://. -->
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script>
<style>
  :root { --paper: #EEEBE4; --ink: #09090B; --graphite: #6B7280; --sanguine: #C4472F; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Switzer", system-ui, sans-serif; }
  header { padding: 32px 24px 8px; max-width: 1200px; margin: 0 auto; }
  h1 { margin: 0; font-size: 32px; letter-spacing: -0.035em; font-weight: 600; }
  p { color: var(--graphite); margin: 6px 0 0; }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; padding: 24px; max-width: 1200px; margin: 0 auto; }
  figure { margin: 0; background: #F7F5F0; border-radius: 14px; overflow: hidden; box-shadow: 0 0 0 1px rgba(9,9,11,0.07); }
  figure.night { background: #141417; color: #F4F4F5; }
  model-viewer { width: 100%; height: 260px; --poster-color: transparent; }
  figcaption { padding: 10px 14px 14px; font: 13px/1.4 ui-monospace, monospace; display: flex; justify-content: space-between; }
  a { color: inherit; }
</style>
</head>
<body>
<header>
  <h1>ProtoVinci 3D models</h1>
  <p>Built from code. Drag to orbit; click a name to download the .glb.</p>
</header>
<main id="grid"></main>
<script>
  const MODELS = ["logo-mark", "logo-mark-two-tone", "quill", "cradle-tube", "logo-plinth", "line-climb", "line-step", "line-helix",
    "browser-window", "phone", "workflow-node", "scale-unit", "scale-field", "paper-sheet", "construction-set"];
  const NIGHT = new Set(["workflow-node", "scale-unit", "scale-field", "line-climb", "line-helix"]);
  const grid = document.getElementById("grid");
  for (const id of MODELS) {
    const fig = document.createElement("figure");
    if (NIGHT.has(id)) fig.className = "night";
    fig.innerHTML = `<model-viewer src="glb/${id}.glb" poster="previews/${id}.jpg" camera-controls auto-rotate
      rotation-per-second="18deg" shadow-intensity="0.6" exposure="1.05" environment-image="neutral" loading="lazy"></model-viewer>
      <figcaption><a href="glb/${id}.glb" download>${id}</a><span>.glb</span></figcaption>`;
    grid.appendChild(fig);
  }
</script>
</body>
</html>
